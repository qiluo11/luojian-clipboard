[package]
name = "luojian"
version = "0.1.0"
description = "LuoJian (落笺) clipboard manager, a modified version of TieZ"
authors = ["LongDz", "qiluo11"]
edition = "2021"
license = "GPL-3.0-only"
default-run = "luojian"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
portable = []
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }

arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
tokio = { version = "1", features = ["time"] }
# 局域网文件传输（手机扫码收发文件）
axum = { version = "0.8.8", features = ["multipart", "ws", "macros"] }
axum-extra = { version = "0.12.5", features = ["multipart"] }
local-ip-address = "0.6.8"
tokio-util = { version = "0.7.18", features = ["io"] }
futures = "0.3.31"
mime_guess = "2.0.5"
tauri-plugin-dialog = "2.6"
tauri-plugin-global-shortcut = "2.3.1"
window-vibrancy = "0.7.1"

regex = "1.12.2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
tauri-plugin-autostart = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
windows-version = "0.1.1"
# Windows Explorer access-history collection: Recent (*.lnk) directory watcher.
notify = "6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_Variant"] }
windows-core = "0.61"
# 与 tauri/wry 使用的版本保持一致（见 Cargo.lock），用于设置 WebView2 内存目标级别
webview2-com = "0.38"
windows-version = "0.1.1"
winreg = "0.55.0"

# ============ Release 体积优化 ============
[profile.release]
# 启用 LTO (Link Time Optimization) - 可减少约 10-20% 体积
lto = true
# 使用单个 codegen unit，更好的优化但编译更慢
codegen-units = 1
# 优化级别：s = 优化大小，z = 更激进的大小优化
opt-level = "s"
# 移除符号表和调试信息
strip = true
# 启用 panic = abort 减少 unwinding 代码
panic = "abort"
